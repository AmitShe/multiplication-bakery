<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fcf1ea">
  <meta name="apple-mobile-web-app-title" content="מאפיית הכפל">
  <meta name="description" content="אופים מגשי כפל, פותרים תרגילים ומתקדמים בלוח הכפל עד 10×10.">
  <title>מאפיית הכפל</title>
  <link rel="icon" href="assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="game.js"></script>
</head>
<body>
  <main class="app">
    <header class="top">
      <a class="utility" href="https://amitshe.github.io/" aria-label="חזרה למגרש המשחקים">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7M6 10v9h12v-9M10 19v-5h4v5"/></svg>
      </a>
      <div class="brand"><span aria-hidden="true">✦</span> מאפיית הכפל</div>
      <button class="utility sound" type="button" id="sound" aria-label="צלילים" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l4-4v14l-4-4H4z"/><path class="waves" d="M16 9c2 2 2 4 0 6m2-8c3 3 3 7 0 10"/><path class="muted" d="m16 10 4 4m0-4-4 4"/></svg>
      </button>
    </header>

    <section class="banner" aria-label="המאפייה">
      <img src="assets/shop.webp" alt="" fetchpriority="high" draggable="false">
      <div class="banner-copy">
        <h1>מאפיית<br>הכפל</h1>
        <p>כל תרגיל ממלא את המגש</p>
      </div>
    </section>

    <section class="workbench" aria-labelledby="level">
      <div class="level-row">
        <h2 id="level">מגש 1</h2>
        <span class="tally" id="tally"></span>
      </div>
      <progress id="progress" value="0" max="5" aria-label="התקדמות במגש"></progress>

      <div id="order">
        <div class="ticket">
          <div id="problem" class="problem" dir="ltr" aria-live="polite"></div>
          <button id="hint" class="hint" type="button" aria-controls="model" aria-expanded="false">לראות עוגיות</button>
        </div>
        <div id="model" class="model" hidden></div>
        <div class="choices" id="choices" aria-label="תשובות אפשריות"></div>
        <p class="feedback" id="feedback" role="status"></p>
      </div>
      <div class="ready" id="ready" hidden>
        <div class="seal" aria-hidden="true">✦</div>
        <h3>המגש מוכן!</h3>
        <p id="ready-text"></p>
        <button id="next" type="button">למגש הבא <span aria-hidden="true">←</span></button>
      </div>
    </section>
  </main>
</body>
</html>
